{% extends 'base.html' %}

{% block title %}Select Movie{% endblock %}

{% block content %}
<div class="container">
  <h1 class="heading">Select Movie</h1>
  {% for movie in options %}
  <p>
    <a href="{{ url_for('find_movie', id=movie.id) }}">
      {{ movie.title }} - {{ movie.release_date.split("-")[0] if movie.release_date else "N/A" }}
    </a>
  </p>
  {% endfor %}
</div>
{% endblock %}
