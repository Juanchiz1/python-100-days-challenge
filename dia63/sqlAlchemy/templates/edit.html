<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Rating</title>
</head>
<body>
    <form action="{{ url_for('edit') }}" method="POST">
        <p>Book Name: {{ book.title }}</p>
        <p>Current Rating: {{ book.rating }}</p>
        
        <!-- Input para ingresar el nuevo rating -->
        <input type="text" name="rating" placeholder="New Rating" required>
        
        <!-- Input oculto para enviar el ID del libro durante el POST -->
        <input type="hidden" name="id" value="{{ book.id }}">
        
        <button type="submit">Change Rating</button>
    </form>
</body>
</html>
