<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Library</title>
</head>
<body>
    <h1>My Library</h1>

    {% if not books %}
        <p>Library is empty.</p>
    {% else %}
        <ul>
            {% for book in books %}
                <li>
                    <!-- Enlace para eliminar pasando el id por parámetro de consulta -->
                    <a href="{{ url_for('delete', id=book.id) }}">Delete</a> 
                    {{ book.title }} - {{ book.author }} - {{ book.rating }}/10
                    <!-- Enlace para editar la calificación pasando el id por parámetro -->
                    <a href="{{ url_for('edit', id=book.id) }}">Edit Rating</a>
                </li>
            {% endfor %}
        </ul>
    {% endif %}

    <a href="{{ url_for('add') }}">Add New Book</a>
</body>
</html>
