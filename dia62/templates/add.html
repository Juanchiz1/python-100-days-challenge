{% extends "base.html" %}
{% from 'bootstrap5/form.html' import render_form %}

{% block title %}Add A New Cafe{% endblock %}

{% block content %}
<div class="container mt-5" style="max-width: 600px;">
    <h1>Add a new cafe into the database</h1>
    <!-- Renderizado dinámico del formulario desactivando la validación del navegador -->
    {{ render_form(form, novalidate=True) }}
    <p class="mt-3"><a href="{{ url_for('cafes') }}">See all cafes</a></p>
</div>
{% endblock %}
